# Docker Compose stack for OpenTelemetry tracing E2E validation.
#
# Usage:
#   cd tools/tracing
#   docker compose up -d
#
# Then start Redpanda with tracing enabled:
#   rpk redpanda start --set tracing_enabled=true \
#                       --set tracing_endpoint=http://localhost:4318
#
# Produce some messages:
#   rpk topic create test
#   echo "hello" | rpk topic produce test
#
# View traces in Grafana:
#   Open http://localhost:3000 -> Explore -> Tempo

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3000:3000"
    depends_on:
      - tempo

volumes:
  tempo-data:
